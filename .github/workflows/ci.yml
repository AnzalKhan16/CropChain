name: CropChain CI/CD & Security Audit

# Triggers: Push to main branch and Pull Requests targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Global environment variables
env:
  NODE_ENV: test
  CI: true

jobs:
  # Job 1: Smart Contract Tests
  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Cache Node Modules
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: smart-contracts/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('smart-contracts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install dependencies
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      # Step 5: Run Hardhat tests
      - name: Run Smart Contract Tests
        working-directory: smart-contracts/
        run: npm run test:ci

      # Step 6: Compile contracts (additional verification)
      - name: Compile Smart Contracts
        working-directory: smart-contracts/
        run: npx hardhat compile

  # Job 2: Smart Contract Security Audit
  smart-contract-security-audit:
    name: Smart Contract Security Audit
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Cache Node Modules
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: smart-contracts/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('smart-contracts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install dependencies
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: smart-contracts/
        run: npm ci --legacy-peer-deps

      # Step 5: Run Slither Security Analysis
      - name: Run Slither Security Analysis
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: "smart-contracts/contracts/"
          fail-on: none
          slither-args: '--filter-paths "smart-contracts/contracts/lib/openzeppelin/**" --exclude naming-convention,external-function,low-level-calls,assembly,constable-states'

  # Job 3: Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Cache Node Modules
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install backend dependencies
      - name: Install backend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: backend/
        run: npm ci --legacy-peer-deps

      # Step 5: Run backend tests
      - name: Run Backend Tests
        working-directory: backend/
        run: npm run test:ci

  # Job 4: Frontend Build Check
  frontend-build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Cache Node Modules
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install frontend dependencies
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      # Step 5: Build frontend (TypeScript compilation check)
      - name: Build Frontend
        working-directory: frontend/
        run: npm run build

  # Job 5: Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 3: Cache Node Modules
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install frontend dependencies
      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: frontend/
        run: npm ci --legacy-peer-deps

      # Step 5: Run frontend tests
      - name: Run Frontend Tests
        working-directory: frontend/
        run: npm run test:ci
